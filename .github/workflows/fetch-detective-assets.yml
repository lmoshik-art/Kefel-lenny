name: הורדת נכסי תעלומת המעבדה

# מוריד את התמונות שהופקו ב-Higgsfield, מקטין אותן ושומר במאגר. מופעל ידנית מלשונית Actions
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: התקנת ספריית עיבוד התמונה
        run: pip install pillow

      - name: הורדה, בדיקה והקטנה
        run: |
          set -e
          dir=detective-lab/public/assets/higgsfield
          base=https://d8j0ntlcm91z4.cloudfront.net/user_3EXHOR3GdvIPrnDYc76PDR1FysN
          declare -A files=(
            [office]=hf_20261009_071723_625322f4-31f8-418e-b8ca-fc5099b7597c.png
            [evidence]=hf_20261009_071723_e06ec462-be7b-4bbd-b45d-18a3b346e136.png
            [finale]=hf_20261009_071725_76af3a6a-b397-4497-b4ef-c398963ab4e6.png
          )
          for name in "${!files[@]}"; do
            curl -sSfL -o "/tmp/$name.png" "$base/${files[$name]}"
            python3 - "$name" "$dir" <<'PY'
          import sys
          from PIL import Image
          name, out = sys.argv[1], sys.argv[2]
          img = Image.open(f'/tmp/{name}.png').convert('RGB')
          assert img.width >= 800, 'התמונה קטנה מדי'
          if img.width > 1600:
              img = img.resize((1600, round(img.height * 1600 / img.width)), Image.LANCZOS)
          img.save(f'{out}/{name}.jpg', quality=82, optimize=True, progressive=True)
          print(name, img.size)
          PY
          done
          ls -l "$dir"

      - name: שמירה במאגר
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detective-lab/public/assets/higgsfield
          if git diff --cached --quiet; then
            echo "אין שינוי"
          else
            git commit -m "הוספת תמונות Higgsfield לתעלומת המעבדה"
            git push
          fi
