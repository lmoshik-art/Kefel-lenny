name: פריסה ל-GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# פריסה אחת בכל רגע נתון
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: משיכת המאגר
        uses: actions/checkout@v4

      - name: התקנת Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: התקנת חבילות
        run: npm ci

      - name: בנייה לייצור
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: פרסום תוצרי הבנייה לענף gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # מונע מ-Jekyll לדלג על קבצים, ומוסיף דף שגיאה שמחזיר לאפליקציה
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "פרסום האתר מתוך ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "הענף gh-pages עודכן"
